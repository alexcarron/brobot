name: Continuous Integration

# Runs on pushes to any branch
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  continuous-integration:
    runs-on: ubuntu-latest

    steps:
      # Clone repository code into workspace
      - name: Checkout code
        uses: actions/checkout@v5

      # Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set timezone to your local timezone
        run: sudo timedatectl set-timezone America/Chicago

      - name: Generate token file for CI
        run: |
          mkdir -p bot-config
          cat <<'EOF' > bot-config/token.js
          // This file is auto-generated by CI
          module.exports = {
            DISCORD_TOKEN: "test-discord-token",
            GITHUB_TOKEN: "test-github-token"
          };
          EOF


      - name: Install Node.js project dependencies
        run: npm ci

      # Pull requests get the same fast checks as the local pre-commit hook.
      # Direct pushes get the same strict, uncached checks as the local pre-push hook,
      # since a push can bypass the local hook (e.g. --no-verify) and this is the last gate before main.
      - name: Run linter to check code quality
        run: ${{ github.event_name == 'push' && 'npm run lint:ci' || 'npm run lint' }}

      - name: Run type checker
        run: ${{ github.event_name == 'push' && 'npm run typecheck:ci' || 'npm run typecheck' }}

      - name: Run unit tests
        run: ${{ github.event_name == 'push' && 'npm run test:ci' || 'npm test' }}
